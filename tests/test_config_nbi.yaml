# Test configuration for NBI IDS

# Fields to skip OMAS comparison for (composer still tested)
# Format: field_path: "reason for skipping"
skip_fields:
  nbi.unit.species.z_n: "imas_composer-only field, no OMAS reference"
  nbi.unit.species.label: "imas_composer-only field, no OMAS reference"
  # imas_composer selects active beams via the dedicated FIRED flag; OMAS's
  # nbi_active_hardware still selects them via PINJ time-trace presence, so the
  # beam lists (and therefore array order/length) can diverge. Compared instead
  # by beam name in test_composition_matches_omas_by_beam_name.
  nbi.unit.name: "beam list order/length diverges from OMAS; see test_composition_matches_omas_by_beam_name"
  nbi.unit.power_launched.time: "beam list order/length diverges from OMAS; see test_composition_matches_omas_by_beam_name"
  nbi.unit.power_launched.data: "beam list order/length diverges from OMAS; see test_composition_matches_omas_by_beam_name"
  nbi.unit.energy.time: "beam list order/length diverges from OMAS; see test_composition_matches_omas_by_beam_name"
  nbi.unit.energy.data: "beam list order/length diverges from OMAS; see test_composition_matches_omas_by_beam_name"
  nbi.unit.species.a: "beam list order/length diverges from OMAS; see test_composition_matches_omas_by_beam_name"

# Requirement validation settings
requirement_validation:
  # MDSplus paths that use calibration/setup data (shot 0), not the requested shot
  allow_different_shot: []
  # Optional MDSplus paths that may not exist (exceptions are allowed)
  optional_requirements:
    - '\\NB::TOP.NB{beam_name}.VBEAM'

# OMAS path mapping
# Maps imas_composer notation to OMAS notation for fetching reference data
# For unit fields, OMAS uses .: to index all units at once
omas_path_map:
  # Unit fields (add .: to fetch all units)
  nbi.unit.name: nbi.unit.:.name
  nbi.unit.power_launched.time: nbi.unit.:.power_launched.time
  nbi.unit.power_launched.data: nbi.unit.:.power_launched.data
  nbi.unit.energy.time: nbi.unit.:.energy.time
  nbi.unit.energy.data: nbi.unit.:.energy.data
  nbi.unit.species.a: nbi.unit.:.species.a
  # z_n/label have no OMAS reference (skipped above); mapping kept for documentation
  nbi.unit.species.z_n: nbi.unit.:.species.z_n
  nbi.unit.species.label: nbi.unit.:.species.label
