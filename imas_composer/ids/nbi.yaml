# NBI (Neutral Beam Injection) IDS Configuration for DIII-D

# GAS string -> species. A fired beam reports one of these (see NB{beam_name}.FIRED);
# an unfired beam reports an empty string.
gas_species:
  H2:
    a: 1.0
    z_n: 1.0
    label: "H"
  D2:
    a: 2.0
    z_n: 1.0
    label: "D"
  HE:
    a: 4.0
    z_n: 2.0
    label: "He"

# NBI configuration
# DIII-D beam names
beam_names:
  - "30L"
  - "30R"
  - "15L"
  - "15R"
  - "21L"
  - "21R"
  - "33L"
  - "33R"

# Supported fields (complete list of implemented IDS paths)
fields:
  - unit.name
  - unit.power_launched.time
  - unit.power_launched.data
  - unit.energy.time
  - unit.energy.data
  - unit.species.a
  - unit.species.z_n
  - unit.species.label
