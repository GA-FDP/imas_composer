name: imas_composer

channels:
  - ga-fdp
  - conda-forge

dependencies:
  # Core runtime deps
  - python >=3.11
  - numpy >=1.24
  - pyyaml *
  - awkward *
  - scipy *

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # Default fetching backend
  # FDP data access: Pelican/XRootD transport and the store schema used by toksearch
  - xrdcl-pelican-fdp
  - fdp-schema >=0.2.1
  - pelicanplatform >=7.24.3,<8

   # mdsip-fdp with normal MDSplus
  - mdsplus >=7.157
  - mdsip-fdp

  # For pip install
  - pip *
  - setuptools
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt