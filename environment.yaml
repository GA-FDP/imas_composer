name: imas_composer

channels:
  - ga-fdp
  - conda-forge

dependencies:
  # Core runtime deps
  # An exact minor version: with any python range (even >=3.11,<3.13)
  # mamba 2.9 is still solving after minutes; =3.12 and =3.13 take seconds.
  - python =3.12
  - numpy >=1.24
  - pyyaml *
  - awkward *
  - scipy *

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # toksearch, toksearch_d3d and fdp are pip-installed from their submodules,
  # not from conda: the conda fdp requires the conda toksearch, which clashes
  # with the toksearch_submodule install. Their run requirements, taken from
  # each submodule's recipe/recipe.yaml, are listed here instead.

  # toksearch_submodule (builds a C extension, hence the compiler)
  - gcc
  - openblas
  - pymssql
  - ray-core
  - pyspark >=4
  - sh
  - xarray
  - bottleneck
  - joblib >=1.3
  - jupyter
  - fsspec
  - zarr =3
  - anthropic >=0.34
  - openai >=1.50
  - claude-agent-sdk >=0.2
  - gradio >=4
  - mcp >=1.23,<2
  - matplotlib
  - plotly
  - python-kaleido

  # toksearch_d3d_submodule
  - python-duckdb >=1.5,<2
  - duckdb-extension-httpfs >=1.5,<2
  - sqlglot >=30
  - ptdata >=2.13.0,<3
  - filelock >=3

  # shared by toksearch, toksearch_d3d and fdp; fdp-schema takes
  # toksearch_d3d's floor, the highest of the three
  - fdp-schema >=0.3.0
  - pelicanplatform >=7.24.3,<8

  # fdp_submodule. Its recipe also lists graphviz, only so that conda links
  # the fdp CLI over graphviz's bin/fdp; a pip-installed fdp has no such
  # problem without graphviz in the environment, so it is left out.
  - xrdcl-pelican-fdp

  # mdsip-fdp with normal MDSplus. toksearch's recipe asks for mdsplus-xrdcl;
  # mdsip-fdp is built for both providers.
  - mdsplus >=7.157
  - mdsip-fdp >=0.1.0

  # For pip install
  - pip *
  - setuptools
  - versioneer
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt
