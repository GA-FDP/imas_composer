name: imas_composer

channels:
  - ga-fdp
  - conda-forge

dependencies:
  # Core runtime deps
  - python >=3.11
  - numpy >=1.24
  - pyyaml *
  - awkward *
  - scipy *

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # Default fetching backend
  - toksearch_d3d *


  # For pip install
  - pip *
  - setuptools
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt