name: imas_composer

channels:
  - ga-fdp
  - conda-forge

dependencies:
  # Core runtime deps
  - python >=3.11
  - numpy >=1.24
  - pyyaml *
  - awkward *
  - scipy *
  - f90nml # parsing EFIT k-files

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # Default fetching backend
  # fdp: toksearch_d3d's FDP environment bootstrap (build_device_config)
  # needs >=0.12.1, matching toksearch_d3d's own pin
  - fdp >=0.12.1
  # FDP data access: Pelican/XRootD transport and the store schema used by toksearch
  - xrdcl-pelican-fdp
  - fdp-schema >=0.2.1
  - pelicanplatform >=7.24.3,<8

   # mdsip-fdp with normal MDSplus
  - mdsplus >=7.157
  - mdsip-fdp

  # toksearch_d3d (pip-installed from toksearch_d3d_submodule) imports ptdata
  - ptdata >=2.13.0,<3

  # For pip install
  - pip *
  - setuptools
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt