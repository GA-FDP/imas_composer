name: imas_composer

channels:
  - conda-forge
  - ga-fdp

dependencies:
  # Core runtime deps
  - python >=3.11
  - numpy >=1.24,<3
  - pyyaml *
  - awkward *
  - scipy *

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # toksearch run requirements, mirroring toksearch_submodule/recipe/recipe.yaml
  # (toksearch itself is pip-installed from toksearch_submodule, not conda,
  # since we need an unreleased version). Listed here so they are part of the
  # initial solve instead of a later `--only-deps` install.
  # Normal MDSplus instead of the recipe's mdsplus-xrdcl
  - mdsplus >=7.157
  - mdsip-fdp >=0.1.0
  - fdp-schema >=0.2.1
  - pymssql
  - ray-core
  - pyspark >=4
  - sh
  - xarray
  - bottleneck
  - openblas
  - joblib >=1.3
  - jupyter
  - fsspec
  - zarr =3
  - anthropic >=0.34
  - openai >=1.50
  - claude-agent-sdk >=0.2
  - gradio >=4
  - mcp >=1.23,<2
  - matplotlib
  - plotly
  - python-kaleido

  # toksearch build requirements for the pip install (ell1module C extension)
  - gcc
  - versioneer

  # Pelican/XRootD transport, not in the toksearch recipe
  - xrdcl-pelican-fdp
  - pelicanplatform >=7.24.3,<8

  # For pip install
  - pip *
  - setuptools
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt

  # OMAS dependencies only
  - boto3
  - botocore
  - cython
  - dnspython
  - matplotlib-base
  - netcdf4
  - pint
  - pymongo
  - pyro5
  - uncertainties
  - xarray
  - xmltodict