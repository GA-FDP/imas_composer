name: imas_composer

channels:
  - conda-forge
  - ga-fdp

dependencies:
  # Core runtime deps
  - python >=3.11
  - numpy >=1.24
  - pyyaml *
  - awkward *
  - scipy *

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # toksearch requirements (toksearch itself is pip-installed from
  # toksearch_submodule, not conda, since we need an unreleased version)
  - gcc
  - openblas
  - pymssql
  - ray-core
  - pyspark >=4
  - sh
  - bottleneck
  - joblib >=1.3
  - jupyter
  - fsspec
  - zarr =3
  - anthropic >=0.34
  - openai >=1.50
  - claude-agent-sdk >=0.2
  - gradio >=4
  - mcp >=1.23
  - plotly
  - python-kaleido

  # fdp: toksearch_d3d's FDP environment bootstrap (build_device_config)
  # needs >=0.12.1, matching toksearch_d3d's own pin
  - fdp >=0.12.1
  - xrdcl-pelican-fdp
  - fdp-schema >=0.2.1
  - pelicanplatform >=7.24.3,<8 # also required by fdp

  # toksearch requirements
  - versioneer
  - filelock >=3

 # mdsip-fdp with normal MDSplus
  - mdsplus >=7.157
  - mdsip-fdp

  # toksearch_d3d (pip-installed from toksearch_d3d_submodule) imports ptdata
  - ptdata >=2.13.0,<3

  # For pip install
  - pip *
  - setuptools
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt

  # OMAS dependencies only
  - boto3
  - botocore
  - cython
  - dnspython
  - matplotlib-base
  - netcdf4
  - pint
  - pymongo
  - pyro5
  - uncertainties
  - xarray
  - xmltodict