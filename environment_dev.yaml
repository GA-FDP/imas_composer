name: imas_composer

channels:
  - conda-forge
  - ga-fdp

dependencies:
  # Core runtime deps
  - python >=3.11
  - numpy >=1.24,<2
  - pyyaml *
  - awkward *
  - scipy *

  # Test tools
  - pytest *
  - pytest-benchmark *
  - pytest-xdist *
  - pexpect *
  - tqdm *

  # toksearch requirements (toksearch itself is pip-installed from
  # toksearch_submodule, not conda, since we need an unreleased version)
  - gcc
  - openblas
  - mdsip-fdp
  - pymssql
  - ray-core
  - pyspark >=4
  - sh
  - bottleneck
  - joblib >=1.3
  - jupyter
  - fsspec
  - zarr =3
  - anthropic >=0.34
  - openai >=1.50
  - claude-agent-sdk >=0.2
  - gradio >=4
  - mcp >=1.23
  - plotly
  - python-kaleido

  # fdp requirements (fdp itself is pip-installed from fdp_submodule,
  # not conda, to match the unreleased toksearch above)
  - xrdcl-pelican-fdp
  - fdp-schema >=0.2.1

  # toksearch_d3d requirements
  - versioneer
  - ptdata >=2.0.13,<3
  - filelock >=3
  - pelicanplatform >=7.24.3,<8 # also required by fdp

  # For pip install
  - pip *
  - setuptools
  - contourpy
  - pyqtgraph
  - pyodbc
  - pyqt

  # OMAS dependencies only
  - boto3
  - botocore
  - cython
  - dnspython
  - matplotlib-base
  - netcdf4
  - pint
  - pymongo
  - pyro5
  - uncertainties
  - xarray
  - xmltodict